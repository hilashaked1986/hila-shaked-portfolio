<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hila Shaked — Portfolio Home Preview V30.">
  <title>Hila Shaked — Home Preview V30</title>
  <script>
    /*
      V30 loads the approved V29 markup unchanged and swaps only the
      version-specific stylesheet. This prevents unrelated site changes.
    */
    fetch("home-preview-v29.html")
      .then(function (response) {
        if (!response.ok) throw new Error("Unable to load V29");
        return response.text();
      })
      .then(function (markup) {
        markup = markup
          .replaceAll("home-preview-v29.css", "home-preview-v30.css")
          .replaceAll("Home Preview V29", "Home Preview V30")
          .replaceAll("Portfolio Home Preview V29", "Portfolio Home Preview V30");
        document.open();
        document.write(markup);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML =
          '<p style="font-family:Arial,sans-serif;padding:40px">Unable to load the portfolio preview.</p>';
      });
  </script>
</head>
<body></body>
</html>
