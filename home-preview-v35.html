<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hila Shaked — Portfolio Home Preview V35.">
  <title>Hila Shaked — Home Preview V35</title>
  <script>
    fetch("home-preview-v29.html")
      .then(function (response) {
        if (!response.ok) throw new Error("Unable to load V29");
        return response.text();
      })
      .then(function (markup) {
        markup = markup
          .replaceAll("home-preview-v29.css", "home-preview-v35.css")
          .replaceAll("Home Preview V29", "Home Preview V35")
          .replaceAll("Portfolio Home Preview V29", "Portfolio Home Preview V35")
          .replace(
            '<canvas class="ambient-air" data-ambient-air data-count="24" data-opacity="0.16" data-speed="0.012" aria-hidden="true"></canvas>',
            '<canvas class="ambient-air ambient-air-v35" data-v35-air data-density="hero" aria-hidden="true"></canvas>'
          )
          .replace(
            '<canvas class="ambient-air" data-ambient-air data-count="40" data-opacity="0.14" data-speed="0.009" aria-hidden="true"></canvas>',
            '<canvas class="ambient-air ambient-air-v35" data-v35-air data-density="about" aria-hidden="true"></canvas>'
          );

        const oldContact = `<h2 id="contact-title">Let’s <span class="contact-v29__talk">talk</span>.</h2>
            <p class="contact-v22__note">I'd love to hear from you.</p>`;

        const newContact = `<h2 id="contact-title"><span>Let’s</span><span>talk.</span></h2>`;

        markup = markup
          .replace(oldContact, newContact)
          .replace(
            `<div class="contact-v22__item">
              <span class="contact-v22__label">PHONE</span>`,
            `<span class="contact-v35__small-divider" aria-hidden="true"></span>

            <div class="contact-v22__item">
              <span class="contact-v22__label">PHONE</span>`
          )
          .replace(
            "</body>",
            '<script src="ambient-v35.js"></' + "script></body>"
          );

        document.open();
        document.write(markup);
        document.close();
      })
      .catch(function (error) {
        console.error(error);
        document.body.innerHTML =
          '<p style="font-family:Arial,sans-serif;padding:40px">Unable to load the portfolio preview.</p>';
      });
  </script>
</head>
<body></body>
</html>
