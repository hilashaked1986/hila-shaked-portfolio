<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hila Shaked — Portfolio Home Preview V32.">
  <title>Hila Shaked — Home Preview V32</title>
  <script>
    /*
      V32 deliberately loads the original approved V29 directly.
      This avoids the V30 → V29 / V31 → V30 nesting that prevented
      later CSS and particle changes from being applied.
    */
    fetch("home-preview-v29.html")
      .then(function (response) {
        if (!response.ok) throw new Error("Unable to load V29");
        return response.text();
      })
      .then(function (markup) {
        markup = markup
          .replaceAll("home-preview-v29.css", "home-preview-v32.css")
          .replaceAll("Home Preview V29", "Home Preview V32")
          .replaceAll("Portfolio Home Preview V29", "Portfolio Home Preview V32")
          .replace(
            'data-count="24" data-opacity="0.16" data-speed="0.012"',
            'data-count="64" data-opacity="0.23" data-speed="0.012"'
          )
          .replace(
            'data-count="40" data-opacity="0.14" data-speed="0.009"',
            'data-count="92" data-opacity="0.20" data-speed="0.009"'
          );

        document.open();
        document.write(markup);
        document.close();
      })
      .catch(function () {
        document.body.innerHTML =
          '<p style="font-family:Arial,sans-serif;padding:40px">Unable to load the portfolio preview.</p>';
      });
  </script>
</head>
<body></body>
</html>
